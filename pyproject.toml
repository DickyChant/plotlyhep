[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plotlyhep"
version = "0.2.0"
description = "mplhep, mirrored for Plotly: experiment styles, labels, histogram and ratio helpers, matplotlib<->Plotly conversion, pixel-checked"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
authors = [{ name = "Sitian Qian" }]
keywords = ["hep", "plotly", "mplhep", "histogram", "cms", "atlas"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["plotly>=5.20", "numpy>=1.22"]

[project.urls]
Homepage = "https://github.com/DickyChant/plotlyhep"
Documentation = "https://dickychant.github.io/plotlyhep/"
Gallery = "https://dickychant.github.io/plotlyhep/gallery/"
"Bug Tracker" = "https://github.com/DickyChant/plotlyhep/issues"

[project.optional-dependencies]
# The harness pins the renderer: Plotly 5 + kaleido 0.2.1 ships its own Chromium, so the pixel
# comparison is reproducible on any machine. (Plotly 6 needs kaleido>=1 and a system Chrome.)
test = ["plotly>=5.20,<6", "kaleido==0.2.1", "matplotlib>=3.8", "mplhep>=1.2", "pillow", "scikit-image", "pytest>=7"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = ["plotlyhep[test]", "plotlyhep[docs]", "ruff", "nox", "pre-commit"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["plotlyhep"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
testpaths = ["tests"]
python_files = "test*.py"
log_level = "INFO"
filterwarnings = ["ignore::DeprecationWarning:kaleido", "ignore::DeprecationWarning:plotly"]

[dependency-groups]
dev = ["plotlyhep[test]", "ruff", "mypy", "nox", "pre-commit", "codespell"]

[tool.mypy]
files = ["src"]
warn_unused_configs = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
check_untyped_defs = true
ignore_missing_imports = true      # plotly, mplhep and kaleido ship no stubs

[[tool.mypy.overrides]]
module = "plotlyhep.convert"      # walks matplotlib's artist tree; its dynamic getters do not type-check yet
ignore_errors = true

[tool.codespell]
skip = "*.json,*.png,*.svg,./site,./.venv,./tests/output,*.egg-info,./.git"
ignore-words-list = "hist,ans,ot,nd,te,heros,doubleclick,slac"

[tool.ruff]
line-length = 140
src = ["src", "tests"]
show-fixes = true
extend-exclude = ["*.md", "site"]     # ruff >= 0.14 formats code blocks in Markdown; the docs keep their aligned comments

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
ignore = [
  "E501", "E701", "E702", "E731", "E741",       # compact one-liners and short names are the house style
  "B905", "B023",                               # zip strict; closures in convert.py are called inside their loop
  "RUF001", "RUF002", "RUF003", "RUF005", "RUF015", "RUF046",
  "UP007",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "B011"]
"docs/**" = ["E402", "B007"]
