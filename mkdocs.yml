site_name: plotlyhep
site_description: mplhep, mirrored for Plotly — experiment styles, labels, histograms, ratio panels, hover, slides embedding, matplotlib conversion
site_url: https://dickychant.github.io/plotlyhep/
repo_url: https://github.com/DickyChant/plotlyhep
repo_name: DickyChant/plotlyhep
docs_dir: docs/pages
site_dir: site
copyright: BSD-3-Clause. Style values follow mplhep (BSD-3-Clause).

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: light mode

nav:
  - Home: index.md
  - Install: install.md
  - Guide:
      - Styles and figures: guide/styles.md
      - Experiment labels: guide/labels.md
      - Histograms and hover: guide/histograms.md
      - Ratio panels: guide/ratio.md
      - Figures in HTML slides: guide/slides.md
      - matplotlib to Plotly and back: guide/convert.md
      - The ROOT look: guide/root.md
  - Gallery: https://dickychant.github.io/plotlyhep/gallery/
  - Editor: https://dickychant.github.io/plotlyhep/gallery/editor/
  - API reference: api.md
  - Testing: testing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: docs/pages
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 3
